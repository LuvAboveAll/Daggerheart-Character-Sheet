<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love’s Daggerheart Loot</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#f3ead6;--panel:#fbf5e6;--panel2:#efe3c8;--ink:#2a2036;--muted:#6b5f78;--gold:#8a6a1c;--accent:#8e2f45;--line:#cdb98a;--err:#a3162f;--ok:#2f6b3f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150f26;--panel:#211a3a;--panel2:#2b2248;--ink:#efe6d2;--muted:#a99dc0;--gold:#d9b45a;--accent:#e0647c;--line:#4a3d78;--err:#ff8095;--ok:#7fd49a}}
:root[data-theme="dark"]{--bg:#150f26;--panel:#211a3a;--panel2:#2b2248;--ink:#efe6d2;--muted:#a99dc0;--gold:#d9b45a;--accent:#e0647c;--line:#4a3d78;--err:#ff8095;--ok:#7fd49a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lora,Georgia,serif;line-height:1.5;padding:0 14px 110px}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0;color:var(--gold);letter-spacing:.02em}
header{max-width:1100px;margin:0 auto;padding:20px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(1.5rem,5vw,2.3rem)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--gold);background:var(--panel2);padding:9px 14px;border-radius:6px;min-height:40px}
button:hover{background:var(--gold);color:var(--bg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:1.05rem}
button.primary:hover{filter:brightness(1.12);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
select,input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;min-height:40px;width:100%}
main{max-width:1100px;margin:0 auto;display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){main{grid-template-columns:350px 1fr;align-items:start}aside{position:sticky;top:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{font-size:1.1rem;margin-bottom:10px}
details.card>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;min-height:40px;border-radius:6px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'';flex:none;width:.55em;height:.55em;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.card[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
details.card[open]>summary{margin-bottom:10px}
details.card>summary h2{margin:0;flex:1}
.badge{font-size:.8rem;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:1px 9px;white-space:nowrap}
.badge.good{color:var(--ok)}.badge.bad{color:var(--err);border-color:var(--err)}
.roller{border-color:var(--gold);border-width:2px}
.row{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;margin-bottom:8px}
.row.single{grid-template-columns:1fr}
label{font-size:.95rem}
.total{font-size:.9rem;padding:8px 10px;border-radius:6px;background:var(--panel2);margin-top:4px}
.total.bad{color:var(--err);border:1px solid var(--err)}
.total.good{color:var(--ok)}
.hint{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.dice{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.die{min-width:38px;text-align:center;padding:4px 8px;border:1px solid var(--gold);border-radius:6px;font-family:Cinzel,serif;font-weight:700}
.item{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.item.optional{border-left-style:dashed;opacity:.92}
.item h3{font-size:1.05rem;color:var(--ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:.8rem;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:1px 9px}
.tag.opt{border-color:var(--accent);color:var(--accent);font-weight:600}
.Common{border-left-color:#8c8c8c}.Uncommon{border-left-color:#4aa86b}.Rare{border-left-color:#4a86d9}.Legendary{border-left-color:#d9a21c}
.stats{font-size:.9rem;color:var(--muted)}
.feature{margin:6px 0 0}
.err{color:var(--err);border:1px solid var(--err);border-radius:6px;padding:10px;margin-bottom:10px}
.empty{color:var(--muted);text-align:center;padding:36px 10px;border:1px dashed var(--line);border-radius:8px}
.logo{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:64px;height:64px;z-index:5;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
</style>
</head>
<body>
<header>
  <h1>Love’s Daggerheart Loot</h1>
  <div class="tools">
    <button id="importBtn">Import CSV</button>
    <button id="tplBtn">Download CSV template</button>
    <input type="file" id="file" accept=".csv,text/csv" hidden>
  </div>
</header>
<main>
  <aside>
    <details class="card" id="secPresets" open>
      <summary><h2>Presets</h2></summary>
      <select id="preset" aria-label="Presets"></select>
      <p class="hint" id="presetHint"></p>
    </details>
    <details class="card" id="secRarity">
      <summary><h2>Rarity (required)</h2><span class="badge" id="rBadge"></span></summary>
      <div id="rarity"></div>
      <div class="total" id="rTotal"></div>
    </details>
    <details class="card" id="secTypes">
      <summary><h2>Equipment type</h2><span class="badge" id="tBadge"></span></summary>
      <div id="types"></div>
      <div class="total" id="tTotal"></div>
      <p class="hint">Leave all at 0% to draw from every type.</p>
    </details>
    <details class="card" id="secFilters">
      <summary><h2>Filters</h2></summary>
      <div class="row single"><label for="fTier">Tier</label><select id="fTier"></select></div>
      <div class="row single"><label for="fUse">Use</label><select id="fUse"></select></div>
      <div class="row single"><label for="fDmg">Damage type</label><select id="fDmg"></select></div>
    </details>
    <details class="card" id="secDb">
      <summary><h2>Database</h2></summary>
      <p class="hint" id="dbInfo" style="margin:0"></p>
    </details>
  </aside>
  <section>
    <details class="card roller" id="secRoll" open>
      <summary><h2>Roll for loot</h2></summary>
      <div class="row"><label for="nDice">Number of dice to roll</label><input type="number" id="nDice" min="1" max="20" step="1" value="1" inputmode="numeric"></div>
      <div class="row"><label for="dieType">Type of die</label><select id="dieType"><option value="4">d4</option><option value="6">d6</option><option value="8">d8</option><option value="10">d10</option><option value="12" selected>d12</option><option value="20">d20</option></select></div>
      <button class="primary" id="rollBtn">Roll for loot</button>
      <div class="dice" id="dice" aria-live="polite"></div>
      <div id="rollInfo" class="hint"></div>
    </details>
    <div id="msg"></div>
    <div id="results"><div class="empty">Set your rarity and type mix, then roll. Results appear here.</div></div>
  </section>
</main>

<svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Love’s Daggerheart Loot logo">

</svg>

ype":"Consumable","description":"You are Hidden until you deal damage to another creature or until your next rest.","rarity":"Legendary"},{"index":"600","title":"Formoid Serum","equiptype":"Consumable","description":"You can drink this potion to become a swarm of 16 million ants until the end of the scene. You keep and have access to all equipment, loot, and features.","rarity":"Legendary"},{"index":"601","title":"Steelskin Salve","equiptype":"Consumable","description":"You can apply this salve to your skin to gain a bonus to your damage thresholds equal to your tier until the end of the scene.","rarity":"Legendary"},{"index":"602","title":"Godling’s Pomelo","equiptype":"Consumable","description":"You can eat this citrus fruit to clear all Hit Points and Stress.","rarity":"Legendary"},{"index":"603","title":"Snakeskin Spirit","equiptype":"Consumable","description":"You can drink this potion to slough off your outer layer of skin and heal a scar.","rarity":"Legendary"},{"index":"604","title":"Magic-User’s Malison","equiptype":"Consumable","description":"When you release this spellcaster’s trapped soul, you can cast one spell from a card in your vault as if it were in your loadout. This doesn’t work for permanently vaulted cards.","rarity":"Legendary"},{"index":"605","title":"Quintessential Severant","equiptype":"Consumable","description":"You can use this magic blade to cut one magical or metaphysical bond, such as an enchantment, contract, magical tether, or divine oath. When you do, the blade shatters.","rarity":"Legendary"},{"index":"606","title":"Mask of the Echoed Self","equiptype":"Consumable","description":"You can wear this mask during your next level up to swap the values of any of your traits. When you do, the mask becomes your permanent face.","rarity":"Legendary"},{"index":"607","title":"Necroprancer’s Bell","equiptype":"Consumable","description":"You can break this rusted, clapperless bell against the ground to summon a skeletal steed that climbs out of const BUILTIN=SEED.map(o=>{const r={};FIELDS.forEach(f=>r[f]=o[f]==null?'':String(o[f]));return r});
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().trim().replace(/s$/,'');
const rnd=n=>Math.floor(Math.random()*n);
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let DB=load('ldl_db_v2',null);if(!Array.isArray(DB)||!DB.length)DB=BUILTIN;
let PRESETS=load('ldl_presets',DEFAULT_PRESETS);

// ---- Build controls
function pctRows(host,names,prefix){
  host.innerHTML=names.map(n=>`<div class="row"><label for="${prefix}${n}">${n}</label><input type="number" id="${prefix}${n}" min="0" max="100" step="1" value="0" inputmode="numeric"> </div>`).join('');
  host.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{$('preset').value='';presetHint();calc()}));
}
pctRows($('rarity'),RAR,'r_');pctRows($('types'),TYPES,'t_');
$('r_Common').value=100;
function presetOptions(){
  $('preset').innerHTML='<option value="">Custom (use dice)</option>'+Object.keys(PRESETS).map(k=>`<option>${esc(k)}</option>`).join('');
}
presetOptions();
function presetHint(){
  const p=PRESETS[$('preset').value];
  $('presetHint').textContent=p?`Rolls ${p.min} to ${p.max} items. Dice are ignored.`:'Custom mode rolls the number and type of dice you choose.';
  $('nDice').disabled=!!p;$('dieType').disabled=!!p;
}
$('preset').addEventListener('change',()=>{
  const p=PRESETS[$('preset').value];
  if(p){RAR.forEach(r=>$('r_'+r).value=p.rarity[r]||0);TYPES.forEach(t=>$('t_'+t).value=p.types[t]||0)}
  presetHint();calc();
});
function fillFilter(id,label,field){
  const vals=[...new Set(DB.map(r=>String(r[field]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const sel=$(id),cur=sel.value;
  sel.innerHTML=`<option value="">Any ${label}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join('');
  if(vals.includes(cur))sel.value=cur;
}
function refreshDB(){
  fillFilter('fTier','tier','tier');fillFilter('fUse','use','use');fillFilter('fDmg','damage type','dmgType');
  $('dbInfo').textContent=`${DB.length} items in the database.`;
}
const pct=(prefix,names)=>Object.fromEntries(names.map(n=>[n,Math.max(0,Math.round(+$(prefix+n).value)||0)]));
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);

// ---- Percentage calculator
function calc(){
  const r=sum(pct('r_',RAR)),t=sum(pct('t_',TYPES));
  const set=(el,tot,optional,badge)=>{
    const ok=tot===100||(optional&&tot===0);
    el.className='total '+(ok?'good':'bad');
    badge.className='badge '+(ok?'good':'bad');
    badge.textContent=ok?(tot===0?'Any':'100%'):'⚠ '+tot+'%';
    el.textContent=tot===100?'Total: 100%'
      :(optional&&tot===0)?'Total: 0% (any type)'
      :tot<100?`Error: total is ${tot}%. Add ${100-tot}% to reach 100%.`
      :`Error: total is ${tot}%. Remove ${tot-100}% to reach 100%.`;
    return ok;
  };
  const a=set($('rTotal'),r,false,$('rBadge')),b=set($('tTotal'),t,true,$('tBadge'));
  return a&&b;
}

// ---- Rolling
function weighted(w){
  const tot=sum(w);let x=Math.random()*tot;
  for(const k of Object.keys(w)){if(w[k]>0){if(x<w[k])return k;x-=w[k]}}
  return Object.keys(w).find(k=>w[k]>0);
}
function pickItem(type,rar,used){
  const f={tier:$('fTier').value,use:$('fUse').value,dmg:$('fDmg').value};
  const pool=DB.filter(r=>(!type||norm(r.equiptype)===norm(type))&&(!f.tier||String(r.tier)===f.tier)&&(!f.use||r.use===f.use)&&(!f.dmg||r.dmgType===f.dmg));
  const order=[weighted(rar),...RAR.filter(k=>rar[k]>0).sort(()=>Math.random()-.5)];
  for(const k of order){
    const c=pool.filter(r=>norm(r.rarity)===norm(k));
    const fresh=c.filter(r=>!used.has(r));
    const list=fresh.length?fresh:c;
    if(list.length){const it=list[rnd(list.length)];used.add(it);return it}
  }
  return null;
}
function roll(){
  $('msg').innerHTML='';
  if(!calc()){['rTotal','tTotal'].forEach(id=>{if($(id).classList.contains('bad'))$(id).closest('details').open=true});$('msg').innerHTML='<div class="err">Fix the percentages before rolling. Rarity and equipment type (unless all 0%) must each total 100%.</div>';return}
  if(!DB.length){$('msg').innerHTML='<div class="err">The database is empty. Import a CSV first.</div>';return}
  const p=PRESETS[$('preset').value];
  let total,dice=[];
  if(p){total=p.min+rnd(p.max-p.min+1);$('dice').innerHTML='';$('rollInfo').textContent=`${$('preset').value}: ${total} items (range ${p.min} to ${p.max}).`}
  else{
    const n=Math.max(1,Math.min(20,Math.floor(+$('nDice').value)||1));$('nDice').value=n;
    const sides=+$('dieType').value||12;
    dice=Array.from({length:n},()=>1+rnd(sides));total=sum(dice);
    $('dice').innerHTML=dice.map(d=>`<span class="die">${d}</span>`).join('');
    $('rollInfo').textContent=`${n}d${sides} = ${dice.join(' + ')} = ${total} total.`;
  }
  const rar=pct('r_',RAR),typ=pct('t_',TYPES);
  const groups=sum(typ)?TYPES.filter(t=>typ[t]>0).map(t=>({t,x:total*typ[t]/100})):[{t:null,x:total}];
  const used=new Set(),out=[];let missed=0;
  groups.forEach(g=>{
    const n=Math.ceil(g.x-1e-9);
    for(let i=0;i<n;i++){
      const it=pickItem(g.t,rar,used);
      if(!it){missed++;continue}
      out.push({it,opt:n>g.x+1e-9&&i===n-1});
    }
  });
  render(out,missed);
}
function render(out,missed){
  if(!out.length){$('results').innerHTML='<div class="empty">No items match these filters. Loosen a filter or import more items.</div>';return}
  const note=missed?`<div class="err">${missed} item${missed>1?'s':''} could not be found for the current filters.</div>`:'';
  $('results').innerHTML=note+out.map(({it,opt})=>{
    const w=norm(it.equiptype)==='weapon',a=norm(it.equiptype)==='armor';
    const stats=[];
    if(w){if(it.trait)stats.push('Trait: '+it.trait);if(it.range)stats.push('Range: '+it.range);
      if(it.damage)stats.push('Damage: '+it.damage+(it.damageMod||'')+(it.dmgType?' '+it.dmgType:''));
      if(it.burden)stats.push('Burden: '+it.burden)}
    if(a){if(it.baseMajor)stats.push('Major: '+it.baseMajor);if(it.baseSevere)stats.push('Severe: '+it.baseSevere);if(it.baseScore)stats.push('Armor score: '+it.baseScore)}
    if(it.use&&!w)stats.push('Use: '+it.use);
    return `<article class="item ${esc(it.rarity)}${opt?' optional':''}">
      <h3>${opt?'<span class="tag opt">Optional:</span> ':''}${esc(it.title)}</h3>
      <div class="tags"><span class="tag">${esc(it.rarity)}</span><span class="tag">${esc(it.equiptype)}</span>${it.tier?`<span class="tag">Tier ${esc(it.tier)}</span>`:''}${w&&it.use?`<span class="tag">${esc(it.use)}</span>`:''}</div>
      ${stats.length?`<div class="stats">${stats.map(esc).join(' | ')}</div>`:''}
      ${it.feature?`<p class="feature"><strong>Feature:</strong> ${esc(it.feature)}</p>`:''}
      ${it.description?`<p class="stats" style="font-style:italic">${esc(it.description)}</p>`:''}
    </article>`}).join('');
}

// ---- CSV
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c=='"')q=true;
    else if(c==','){row.push(cur);cur=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&text[i+1]=='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}
function importCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2){$('msg').innerHTML='<div class="err">That CSV has no data rows.</div>';return}
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=Object.fromEntries(FIELDS.map(f=>[f,head.indexOf(f.toLowerCase())]));
  if(col.title<0||col.rarity<0||col.equiptype<0){$('msg').innerHTML='<div class="err">Missing required columns. The CSV needs at least title, equiptype and rarity. Download the template to see all fields.</div>';return}
  DB=rows.slice(1).map((r,i)=>{
    const o={};FIELDS.forEach(f=>o[f]=col[f]>=0?(r[col[f]]||'').trim():'');
    if(!o.index)o.index=i+1;return o;
  }).filter(o=>o.title);
  save('ldl_db_v2',DB);refreshDB();
  $('msg').innerHTML=`<div class="total good">Imported ${DB.length} items.</div>`;
}
$('importBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>importCSV(String(rd.result));rd.readAsText(f);e.target.value='';
};
$('tplBtn').onclick=()=>{
  const csv=FIELDS.join(',')+'\n1,1,Example Sword,Weapon,Primary,Physical,Agility,Melee,d8,+1,One-Handed,,,,"Feature text, with commas in quotes",Short description,Common\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='daggerheart-loot-template.csv';a.click();
};
$('rollBtn').onclick=roll;
refreshDB();presetHint();calc();
</script>
</body>
